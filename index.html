<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我獨自英打 - 版本二</title>
  <style>
    body {
      font-family: system-ui, "Microsoft JhengHei", sans-serif;
      background-color: #0b0c10;
      color: #c5c6c7;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 {
      color: #66fcf1;
      font-size: 2.5rem;
      margin-bottom: 15px;
    }
    img.keyboard-img {
      max-width: 320px;
      margin-bottom: 20px;
      border-radius: 8px;
    }
    .btn {
      padding: 12px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      background-color: #66fcf1;
      color: #0b0c10;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>我獨自英打</h1>
  <!-- 使用相對路徑引用 assets 資料夾素材 -->
  <img src="assets/keyboard.png" alt="鍵盤圖示" class="keyboard-img" onerror="this.style.display='none'">
  <button id="start-btn" class="btn">開始挑戰</button>

  <audio id="beep-sound" src="assets/beep.wav" preload="auto"></audio>

  <script>
    const startBtn = document.getElementById('start-btn');
    const beepSound = document.getElementById('beep-sound');

    startBtn.addEventListener('click', () => {
      beepSound.currentTime = 0;
      beepSound.play().catch(() => alert('播放音效失敗，請檢查 assets/beep.wav 路徑'));
    });
  </script>
</body>
</html>
